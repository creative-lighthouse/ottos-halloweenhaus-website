---
Name: app-email
After:
  - '#mailer'
---
# Mail is configured entirely through environment variables:
#
#   MAILER_DSN      transport, read natively by
#                   SilverStripe\Control\Email\TransportFactory
#                     local / DDEV  smtp://localhost:1025            -> Mailpit
#                     live          smtp://USER:PASS@mailserver:587  -> real server
#
#   SS_ADMIN_EMAIL  default "From" address for outgoing mail (see
#                   App\Events\EmailNotification). Must be on a domain we
#                   DKIM/SPF-sign or Gmail & co. reject the mail. When unset,
#                   SilverStripe falls back to no-reply@<current-host>.
#
# The organiser address entered in the CMS (SiteConfig.EventAdminEmail) is
# used as Reply-To only, never as the envelope sender.
SilverStripe\Control\Email\Email:
  # Nothing to configure here – kept as the single place documenting the
  # mail setup. Do not re-add a hard-coded transport DSN: it breaks per-env
  # configuration (local Mailpit vs. live SMTP).
  admin_email: ''
